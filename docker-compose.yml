services:

  webchat:
    build:
      context: .
      dockerfile: apps/webchat/Dockerfile

    container_name: phonemail-webchat

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL}
      NEXT_PUBLIC_CONVEX_SITE_URL: ${NEXT_PUBLIC_CONVEX_SITE_URL}


    restart: unless-stopped


  webmail:
    build:
      context: .
      dockerfile: apps/webmail/Dockerfile

    container_name: phonemail-webmail

    ports:
      - "3001:3000"

    environment:
      NODE_ENV: production
      NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL}
      NEXT_PUBLIC_CONVEX_SITE_URL: ${NEXT_PUBLIC_CONVEX_SITE_URL}

    restart: unless-stopped